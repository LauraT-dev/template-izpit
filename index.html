<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Template-Izpit</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/main.css">
    </head>
    <body>
    <div class="container">
        <header class="header">
            <div class="header__logo"><img src="assets/logo.svg" alt="logo"></div>
            <nav class="header__nav">
                <ul class="header__nav-list">
                    <li class="header__nav-item">about</li>
                    <li class="header__nav-item">experience</li>
                    <li class="header__nav-item">skill</li>
                    <li class="header__nav-item">portfolio</li>
                    <li class="header__nav-item">contact</li>
                </ul>
            </nav> <!-- e: header-nav -->
        </header> <!-- e: header -->
        <main class="main">
            <div class="main__content">
                <div class="main__image">
                    <img src="assets/hero-picture.png" alt="John Smith">
                </div>
                <div class="main__text">
                    <h1 class="main__title">
                        <span class="name">John</span>
                        <span class="last-name">Smith</span>
                    </h1>
                    <p class="main__description">I design and build things on the internet.</p>
                </div> <!-- e: main__text -->
            </div> <!-- e: main__content -->
            <div class="main__arrow">
                <img src="assets/hero-arrow.png" alt="arrow">
            </div>
        </main> <!-- e: main -->
    </div> <!-- e: container -->
    </body>
</html>
